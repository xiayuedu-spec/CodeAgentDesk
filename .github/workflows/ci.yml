name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的任务。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty 需要原生编译；CI 上按仓库 Node 版本重建。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (main + renderer)
        run: npm run build

      - name: Bundle size report
        run: |
          Get-ChildItem dist/assets -Filter *.js |
            Sort-Object Length -Descending |
            Select-Object -First 12 Name, @{n='kB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize
        shell: pwsh
