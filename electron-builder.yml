appId: com.codeagentdesk.app
productName: CodeAgentDesk
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# 自动更新发布源（electron-updater）。打包发布时需配置 GH_TOKEN 或改内网源。
publish:
  provider: github
  owner: xiayuedu-spec
  repo: CodeAgentDesk
