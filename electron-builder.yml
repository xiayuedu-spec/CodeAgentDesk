appId: com.codeagentdesk.app
productName: CodeAgentDesk
# 产物名必须显式声明成连字符形式：electron-builder 写进 latest.yml 的是
# CodeAgentDesk-Setup-x.y.z.exe，而默认产物名带空格，自动更新会去下载一个
# 不存在的文件名（404）。两者一致才能用 electron-updater 自动更新。
artifactName: '${productName}-Setup-${version}.${ext}'
directories:
  output: release
  buildResources: build
# 只保留用得到的 Chromium 语言包：默认会带 55 个（约 47MB），我们只用中英。
electronLanguages:
  - zh-CN
  - en-US
# 打包体积：NSIS 用最大压缩（构建慢一些，产物小 10%~15%）。
compression: maximum
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # 运行时用不到的开发文件（sourcemap / 测试 / 文档）
  - '!node_modules/**/*.map'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,example,examples}/**'
  # node-pty 自带多架构预编译；我们只出 x64，arm64 那套是纯冗余
  - '!node_modules/node-pty/prebuilds/win32-arm64/**'
  - '!node_modules/node-pty/third_party/conpty/*/win10-arm64/**'
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
# 免安装版：单个 exe，双击即用（数据写在 exe 同级的 data/ 目录）
portable:
  artifactName: '${productName}-Portable-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# 自动更新发布源（electron-updater）。打包发布时需配置 GH_TOKEN 或改内网源。
publish:
  provider: github
  owner: xiayuedu-spec
  repo: CodeAgentDesk
