appId: com.codeagentdesk.app
productName: CodeAgentDesk
# 产物名必须显式声明成连字符形式：electron-builder 写进 latest.yml 的是
# CodeAgentDesk-Setup-x.y.z.exe，而默认产物名带空格，自动更新会去下载一个
# 不存在的文件名（404）。两者一致才能用 electron-updater 自动更新。
artifactName: '${productName}-Setup-${version}.${ext}'
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# 自动更新发布源（electron-updater）。打包发布时需配置 GH_TOKEN 或改内网源。
publish:
  provider: github
  owner: xiayuedu-spec
  repo: CodeAgentDesk
